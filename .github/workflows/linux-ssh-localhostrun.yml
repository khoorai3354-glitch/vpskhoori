name: Linux Cloud SSH via bore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Install & Configure SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          
          # تنظیم رمز عبور برای کاربر پیش‌فرض runner
          echo "runner:P@ssw0rd1qazXSW@#" | sudo chpasswd
          
          # فعال‌سازی ورود با رمز عبور
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          
          # شروع سرویس SSH
          sudo service ssh start
          echo "✅ SSH is running."

      - name: 2. Install & Start bore Tunnel
        run: |
          # دانلود bore (ابزار بسیار سبک - فقط یک فایل باینری)
          curl -L https://github.com/ekzhang/bore/releases/latest/download/bore-v0.5.2-x86_64-unknown-linux-musl.tar.gz -o bore.tar.gz
          tar -xzf bore.tar.gz
          sudo mv bore /usr/local/bin/
          
          # انتخاب یک پورت تصادفی برای bore (مثلاً 23456)
          BORE_PORT=$((RANDOM % 10000 + 20000))
          
          # شروع تونل در پس‌زمینه
          # این دستور پورت 22 محلی را به bore.pub روی پورت BORE_PORT متصل می‌کند
          nohup bore local 22 --to bore.pub --port $BORE_PORT > bore.log 2>&1 &
          
          # صبر برای برقراری اتصال
          sleep 5
          
          # نمایش اطلاعات اتصال
          echo ""
          echo "==========================================================" 
          echo "  >>> 🐧 SSH SERVER IS READY! <<<" 
          echo "  🌐 Public Address : bore.pub"
          echo "  🔢 Public Port    : $BORE_PORT"
          echo "  👤 Username       : runner" 
          echo "  🔑 Password       : P@ssw0rd1qazXSW@#" 
          echo "----------------------------------------------------------"
          echo "  💡 Command        : ssh -p $BORE_PORT runner@bore.pub"
          echo "==========================================================" 

      - name: 3. Keep Server Alive (Max 350 mins)
        run: |
          for ((i=1; i<=350; i++)); do
            sleep 60
            echo "⏳ [$i/350] Server running..."
          done
